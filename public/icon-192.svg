<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00fff0"/>
      <stop offset="100%" stop-color="#ff2ec4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" fill="#050507"/>
  <rect x="9" y="9" width="174" height="174" fill="none" stroke="url(#g)" stroke-width="3"/>
  <text x="96" y="122" font-family="Arial, sans-serif" font-size="84" font-weight="900" fill="#00fff0" text-anchor="middle" filter="url(#glow)">Q</text>
</svg>
