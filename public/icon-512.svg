<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00fff0"/>
      <stop offset="100%" stop-color="#ff2ec4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#050507"/>
  <rect x="24" y="24" width="464" height="464" fill="none" stroke="url(#g)" stroke-width="8"/>
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="220" font-weight="900" fill="#00fff0" text-anchor="middle" filter="url(#glow)">Q</text>
</svg>
