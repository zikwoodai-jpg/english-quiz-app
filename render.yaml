services:
  - type: web
    name: english-quiz-app
    env: node
    plan: free
    # --include=dev is required: NODE_ENV=production below makes npm skip
    # devDependencies (vite, typescript, vite-plugin-pwa) otherwise, breaking the build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_TOKEN
        generateValue: true
